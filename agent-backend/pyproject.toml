[project]
name = "twin-agent"
version = "0.1.0"
description = "AI agent for the digital twin map view: device search, insights, control and map actions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
