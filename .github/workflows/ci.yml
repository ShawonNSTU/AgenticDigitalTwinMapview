name: CI
# On every push and pull request: type checks and tests, the floor's walk-to-every-room check, and the UI layout
# audits (every page at desktop, tablet and phone sizes). Any failure fails the run.
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx tests/experience.test.mts
      - run: npx tsx tests/faults.test.mts
      - run: npx next build

  assistant:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: assistant } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: assistant/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  floor-and-ui:
    # the running app: walk to every room in the renderer, then audit the UI
    runs-on: ubuntu-latest
    needs: web
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Start the web app (simulated devices, a stand-in SmartThings API)
        run: |
          python3 tools/smartthings_mock.py > /tmp/stmock.log 2>&1 &
          cd web && npm ci && npx next build
          SMARTTHINGS_TOKEN=test-token SMARTTHINGS_API=http://127.0.0.1:9010/v1 nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null localhost:3000/api/floor && break; sleep 1; done
      - name: Godot
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1 libglu1-mesa
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Every room can be walked into
        run: tools/check_routes.sh
      - name: UI audits
        run: |
          npm i --no-save --prefix tools puppeteer-core
          NODE_PATH=tools/node_modules OUT=/tmp/ui node tools/ui_audit.js
          NODE_PATH=tools/node_modules OUT=/tmp/ui-deep node tools/ui_audit_deep.js
      - if: failure()
        uses: actions/upload-artifact@v5
        with: { name: ui-audit, path: /tmp/ui*, if-no-files-found: ignore }
